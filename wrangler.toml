name = "austere-cloud"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
# Lowest austere-axi version that uploads and /rt/<v>/ accept: the first release that ships `publish`.
# The only place this value is set; tests read it from the binding. Provisional until RLM-271 confirms it at release.
MIN_CLI_VERSION = "0.9.0"

# Real ids are filled in by the deploy ticket; local dev and tests use local emulation.
[[d1_databases]]
binding = "DB"
database_name = "austere-cloud"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PAGES"
bucket_name = "austere-cloud-pages"

# Secrets (wrangler secret put): IP_HMAC_KEY now; ADMIN_TOKEN and ADMIN_EMAIL arrive with the admin ticket.
# For `wrangler dev`, copy .dev.vars.example to .dev.vars.

# One SQLite-backed page object per page: op log, rows, idempotency keys, WebSocket change feed.
[[durable_objects.bindings]]
name = "PAGE"
class_name = "PageObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageObject"]

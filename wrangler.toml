name = "austere-cloud"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# PNGs are bundled as binary (src/og.png, src/apple-touch-icon.png).
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# The whole hostname goes to this Worker; Cloudflare creates the proxied DNS record.
routes = [{ pattern = "austere.blundertech.com", custom_domain = true }]

[vars]
# The austere-axi release whose hub shell the signed-in `/` loads through /rt/<v>/chrome/shell.{js,css}. Bump it with the
# `austere-axi` dependency, to a release that has the shell's cloud mode (RLM-458).
HUB_VERSION = "0.25.0"
# Lowest austere-axi version that uploads and /rt/<v>/ accept: the first release that ships `publish`.
# The only place this value is set; tests read it from the binding.
MIN_CLI_VERSION = "0.9.0"

# The placeholder id stays here: .github/workflows/deploy.yml looks the real database up by name and
# substitutes it for the deploy. Local dev and tests use local emulation.
[[d1_databases]]
binding = "DB"
database_name = "austere-cloud"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PAGES"
bucket_name = "austere-cloud-pages"

# Secrets: IP_HMAC_KEY, WORKOS_CLIENT_ID, WORKOS_API_KEY and WORKOS_COOKIE_PASSWORD (32+ characters) are GitHub
# Actions secrets that the deploy workflow uploads with the Worker. The three WORKOS_* turn accounts on (RLM-414,
# keys from RLM-415); without them /auth/* answers 503. ADMIN_TOKEN and ADMIN_EMAIL arrive with the admin ticket.
# Optional vars: WORKOS_API_BASE (default https://api.workos.com), WORKOS_ISSUER (accepted access-token issuers, comma-separated).
# For `wrangler dev`, copy .dev.vars.example to .dev.vars.

# One SQLite-backed page object per page: op log, rows, idempotency keys, WebSocket change feed.
[[durable_objects.bindings]]
name = "PAGE"
class_name = "PageObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageObject"]

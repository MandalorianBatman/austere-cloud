<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("BarlowCondensed-Bold.ttf")}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background-color:#000000;color:#EDEDED;font-family:system-ui,"Liberation Sans",Arial,sans-serif;
background-image:linear-gradient(#111113 1px,transparent 1px),linear-gradient(90deg,#111113 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
h1{position:absolute;left:64px;top:60px;width:560px;font:700 104px/0.94 "Barlow Condensed",sans-serif;letter-spacing:-.005em}

.note{background:#111113;border:1px solid #26262B;border-radius:8px;color:#EDEDEF;padding:20px 24px;font-size:28px;line-height:1.3;margin-top:20px}
.tag{background:#F3DD4A;color:#13223A;font:700 28px/1 system-ui,"Liberation Sans",sans-serif;letter-spacing:.08em;padding:6px 10px;margin-left:12px;text-transform:uppercase}
.tb{position:absolute;left:64px;bottom:44px;border:4px solid #EDEDED;background:#0A0A0A;display:flex}
.tb div{padding:12px 16px}
.tb .n{font:700 52px/1 "Barlow Condensed",sans-serif;border-right:2px solid #EDEDED}
.tb .u{font-size:28px;font-weight:600;align-self:center}

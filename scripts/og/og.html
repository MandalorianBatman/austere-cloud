<!doctype html>
<!-- Source of public/og.png (1200x630). Render with scripts/og/render.sh; see DESIGN.md. -->
<meta charset="utf-8">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("BarlowCondensed-Bold.ttf")}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background-color:#F3F5F7;color:#13223A;font-family:system-ui,"Liberation Sans",Arial,sans-serif;
background-image:linear-gradient(#E3E9EF 1px,transparent 1px),linear-gradient(90deg,#E3E9EF 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
h1{position:absolute;left:64px;top:60px;width:560px;font:700 104px/0.94 "Barlow Condensed",sans-serif;letter-spacing:-.005em}
.col{position:absolute;left:700px;top:52px;width:436px}
.app{position:relative;background:#0A0A0A;border:1px solid #26262B;border-radius:10px;color:#EDEDEF;font-size:28px;line-height:1.3;overflow:visible}
.bar{background:#111113;border-bottom:1px solid #26262B;padding:18px 24px;font-weight:600;border-radius:10px 10px 0 0}
.rows{padding:26px 24px 24px;display:grid;gap:14px}
.row{display:flex;gap:18px;padding:10px 18px;border:1px solid #26262B;background:#111113;border-radius:6px;position:relative}
.row i{font-style:normal;color:#A1A1AA}
.cloud{position:relative}
.cloud::after{content:"";position:absolute;pointer-events:none;inset:-14px;padding:14px;--arc:radial-gradient(circle closest-side,transparent 11px,#BF2E18 11px 14px,transparent 14px);
background-image:var(--arc),var(--arc),var(--arc),var(--arc);background-size:28px 28px;background-position:left top,left bottom,left top,right top;background-repeat:round no-repeat,round no-repeat,no-repeat round,no-repeat round;
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.delta{position:absolute;right:-14px;top:-48px;width:52px;height:52px}
.leader{width:3px;height:34px;background:#BF2E18;margin:-14px 0 -1px 60px;position:relative}
.note{background:#111113;border:1px solid #26262B;border-radius:8px;color:#EDEDEF;padding:20px 24px;font-size:28px;line-height:1.3}
.tag{background:#F3DD4A;color:#13223A;font:700 22px/1 system-ui,"Liberation Sans",sans-serif;letter-spacing:.08em;padding:6px 10px;margin-left:12px;text-transform:uppercase}
.tb{position:absolute;left:64px;bottom:44px;border:4px solid #13223A;background:#fff;display:flex}
.tb div{padding:12px 16px}
.tb .n{font:700 52px/1 "Barlow Condensed",sans-serif;border-right:2px solid #13223A}
.tb .u{font-size:28px;font-weight:600;align-self:center}
</style>
<h1>Send your agent’s plan out for review</h1>
<div class="col"><div class="app">
<div class="bar">Q3 migration plan</div>
<div class="rows">
<div class="row"><i>1</i>Copy data</div>
<div class="row"><i>2</i>Switch reads</div>
<div class="cloud" style="position:relative"><div class="row"><i>3</i>Switch writes</div>
<svg class="delta" viewBox="0 0 30 30"><path d="M15 3 28 26H2z" fill="#F3F5F7" stroke="#BF2E18" stroke-width="2"/><text x="15" y="23" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="15" fill="#13223A">1</text></svg></div>
</div></div>
<div class="leader"></div>
<div class="note"><b>Ben</b><span class="tag">Held</span><br>“Rollback step is missing…”</div></div>
<div class="tb"><div class="n">austere</div><div class="u">austere.blundertech.com</div></div>

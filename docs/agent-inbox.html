plumbing = Card([CardHeader("Plannotator: registry, auth, relay", "The cloud part is a relay for phones and cloud agents, not for agents on the machine"), plumbingText])
plumbingText = MarkDownRenderer("- **Sessions.** An in-memory map, rebuilt from polls. A session is live while a poll is held, or for 30 s after one (`packages/server/inbox-sessions.ts:612-698`, `connection.ts:2271`). Pending replies come from the log, so a restart loses none (`store.ts:7304-7380`).\n- **Local auth.** `inbox/inbox.json` (0600) holds the port and a token that rotates on each start. Bridge routes need a loopback Host, no Origin, and `Bearer <token>` (`packages/shared/inbox/registry.ts:1-50`, `packages/server/inbox.ts:6420-6432`). There is no unix socket: processes coordinate with mkdir claims and lease files.\n- **Relay.** A Worker on `relay.plannotator.ai` with one SQLite Durable Object `Mailbox` per mailbox, a `CreateBrake` DO and a rate-limit binding (`apps/relay/wrangler.toml`). The Inbox holds **one outbound WebSocket** with a 30 s heartbeat (`packages/server/inbox-relay.ts:5-35`, `:140`). Sockets hibernate, tagged `inbox` and `device:<id>` (`apps/relay/src/mailbox.ts:503`, `:722`). The relay stores hashes and envelopes sealed with HKDF + AES-GCM (`packages/core/crypto.ts:113-135`). An alarm deletes held rows after 30 days (`mailbox.ts:798`).\n- **Linked machines** skip the relay. They use HTTPS over the tailnet, with an outbox file per machine (`packages/server/inbox-transport-tailnet.ts:2-13`).")

bContract = MarkDownRenderer("**Route.** `GET /api/inbox/socket?cli=<version>`: a WebSocket upgrade with subprotocol `austere-inbox.1` and `Authorization: Bearer <WorkOS access token>`, checked as owner routes are (`src/auth.ts`). `cli` is checked against `MIN_CLI_VERSION` as on the owner page socket (`versionAllowed`, `src/sync.ts:78`). Refusals use the shape of the other handshakes, `{ error: { code, message } }`: 426 with no upgrade, no subprotocol, or a `cli` below `MIN_CLI_VERSION`; 403 for a missing or bad token or a blocked owner.\n\n**Protocol version.** `v: 1` in every frame is the version of `austere-inbox.1`, a protocol of its own. It is not `SYNC_VERSION` (2 in `austere-axi/sync`), and the two move independently.\n\n**Frames.**\n\n- Client to server, `{ v: 1, t: 'list', since }`: once after open, then every 5 minutes. `since` is in ms; see below.\n- Server to client, the answer: `{ v: 1, t: 'pages', at, pages: [{ id, releasedAt }] }`. These are the account's published, unexpired pages with `released_at >= since`. `at` is the InboxObject's clock when it ran the query.\n- Server to client, on each note the owner's agent should get: `{ v: 1, t: 'poke', pages: [{ id, releasedAt }] }`.\n- No frame carries note text or a title.\n- Heartbeat: the client pings; the InboxObject answers with `setWebSocketAutoResponse`, which does not wake it. This is new build work: `PageObject` does not use auto-response today.\n\n**`since` is compared with a margin.** `at` comes from the InboxObject's clock, and `released_at` is written by the PageObject after its commit. A release can therefore carry a time just below an `at` the client already has. The client sends `since` = the newest `at` it has processed minus 60 s, and the server compares with `>=`. A page listed twice costs one pull that finds nothing new, because the pull goes by that page's own cursor.\n\n**A lost poke is caught by the 5-minute list.** A poke can fail (a DO RPC error) while the socket stays open for days. The client's `list` every 5 minutes covers it, so a lost poke delays a wake by at most 5 minutes plus a pull; the normal path is about 1 s. Cost: one InboxObject wake and one D1 query per machine every 5 minutes. A shorter timer trades cost for latency; at 5 minutes it stays well below option C's poll.\n\n**Which notes poke.** The rule the local wake uses today: a note that is `released`. That is a note added on an `--auto` page, or released with `releaseNote` by the owner, on any machine or on the hosted page. Held notes poke nobody.\n\n**Client (austere-axi, another lane).**\n\n- The peer keeps this one socket while cloud is on and the machine is signed in. It sends `list` at open and every 5 minutes.\n- On `pages` or `poke`, it pulls each page id that is in `cloud.json` (`peer.ts`, `kick(link, { pull: true })`).\n- The existing chain applies the note, then wakes a session or starts a run (`src/cli/server.ts:651-660`).\n- Once the pulls for a `pages` frame finish, it keeps that frame's `at` as the newest processed. A `poke` does not move it.")
bData = MarkDownRenderer("**Data.**\n\n- D1 `migrations/0005_inbox.sql`: `ALTER TABLE pages ADD COLUMN released_at INTEGER` (NULL: never). It holds one value per page, the time of its newest release. The poke and the `pages` frame only say that a page has something new; the pull by the page's cursor does the real work.\n- The `list` query is the hub's filter (`ownedRows`, `src/hub.ts:74-86`): `owner_id IN (SELECT id FROM owners WHERE user_id = ?)` plus `released_at >= ?`. It uses the `owners_user` and `pages_owner` indexes; no new index.\n- **`addNote`:** its existing `after` (`src/page.ts:534`) also sets `released_at` when the note is released (an `--auto` page), then pokes.\n- **`releaseNote`:** `settleNote` has no `after` today (`src/page.ts:603-608`). B adds one, only on a held to released change: a new D1 write and a poke. `after` runs once the ack is sent and the rows are broadcast (`src/page.ts:446-448`), so the release ack is not slower. Mutations on a page run one at a time, so the next mutation on that page waits for the write and the RPC.\n- **Failures in `after`.** An uncaught error there closes the socket with 1011. The re-sent mutation then gets its stored ack, so `after` does not run again. Each step therefore catches and logs its own error:\n  - a failed D1 write still pokes, because the poke carries `releasedAt`;\n  - a failed poke is covered by the 5-minute list;\n  - if both fail, the wake is lost until the page's next release or a pull for another reason. That case is accepted and logged.\n- The poke is `env.INBOX.get(idFromName(user_id)).poke(...)`, with `user_id` from `owners.user_id`.\n- `InboxObject` stores no rows. Its sockets, with hibernation tags, are its only state.\n- `wrangler.toml`: binding `INBOX`, class `InboxObject`, migration tag `v2`, `new_sqlite_classes = ['InboxObject']`.")
bRollout = MarkDownRenderer("**Deploy, rollback, what breaks.**\n\n- **Order.** The deploy workflow applies `migrations/` before `wrangler deploy`. Deploy is a push to `main` of austere-cloud. It stays with Sid and is not part of RLM-494.\n- **Existing clients.** Nothing breaks. Older CLIs never open the route, and the page sockets and their frames are unchanged.\n- **Rollback: fix forward, no `wrangler rollback`.** Deploy a commit that removes the route and the poke but keeps the `INBOX` binding and class; they hold no data. Removing the class later needs a `deleted_classes` migration. The column stays, unread.\n- **Risk: two machines.** Two machines holding the same page both pull it and may both wake an agent. This already happens today when both sockets are open.\n- **Risk: token lifetime.** The access token expires after 5 min while the socket stays open. Today's owner page sockets work the same way. Whether to close the socket at token `exp` is open question 1, and it gates the build.\n- **Precondition.** The machine runs a server that does not idle out (`server install`). Without one, notes wait until the next start, as they do today.")
bTests = MarkDownRenderer("**Test plan** (`npm test`, vitest in Miniflare):\n\n1. The owner releases a held note: the account's inbox socket gets one `poke` with that page id. A held note sends no frame.\n2. Another account's socket gets nothing, and a collaborator's account gets nothing.\n3. `list` with `since`: `pages` lists the pages with `released_at >= since`, including one released exactly at `since`. Expired, taken-down and deleted pages are absent.\n4. Handshake: no token or a bad token gets 403. No subprotocol, or a `cli` below `MIN_CLI_VERSION`, gets 426.\n5. A poke with no socket open raises no error, and the mutation is still acked.\n6. The poke RPC fails: the release is still acked, the socket stays open, and the next `list` names the page.\n7. A ping on a hibernated socket gets an answer without waking the object.\n\nOn the austere-axi side (its own lane): poke, then pull, then `wake-poll` answers `wake` within 2 s against a stub service.")

leftOutText = MarkDownRenderer("- **Webhook wake for cloud agents** (plannotator's cloud agents, Claude routines, Multica). This is a product decision: which agents, and where secrets live.\n- **End-to-end encryption** like plannotator's relay. austere-cloud already holds note text in plain form in the page object, and the poke carries none.\n- **Phone push** (APNs, FCM). This is the relay's main job in plannotator; austere has no app.\n- **An Inbox view across pages in the hub.** The hub already shows note counts per page (`/hub/api/pages`, `cloud.notes`). A real inbox UI is FE and product work.\n- **New messages that start an agent from the cloud with no page** (plannotator's New message). There is no page and no contract for it yet.\n- **Wake clients for Claude Code and Codex.** This is local austere-axi work, and Claude Code users need it. Plannotator's routes are the Claude Code mod (`$.prompt.submit`) and `codex queue`; Claude Code channels are another way. It needs a separate issue.\n- **Poke history in the DO.** The D1 column plus a resync on connect is enough.")
